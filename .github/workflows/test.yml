name: Tests

on:
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments forwarded to the test applications, for example --filter-class *Srp6* (a filter brings its own --ignore-exit-code 8)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # only until the prepare step switches host logins to scram
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEXUSTOMORROW_TEST_PG: "Host=localhost;Port=5432;Username=nt_test;Database=postgres"
      NEXUSTOMORROW_TEST_PG_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commit messages
        run: |
          status=0
          for commit in $(git rev-list origin/main..HEAD); do
            subject=$(git log -1 --format=%s "$commit")
            if [ -n "$(git log -1 --format=%B "$commit" | sed -n 2p)" ]; then
              echo "::error::$commit: line 2 of the message must be blank"
              status=1
            fi
            if [ ${#subject} -gt 72 ]; then
              echo "::error::$commit: the headline is ${#subject} characters, over 72"
              status=1
            fi
            case "$subject" in
              *.) echo "::error::$commit: the headline ends with a full stop"; status=1 ;;
            esac
          done
          exit $status

      - name: Em dashes
        run: |
          if git grep -n "$(printf '\342\200\224')" -- '*.cs' '*.md'; then
            echo "::error::Em dashes are banned in .cs and .md files (listed above)"
            exit 1
          fi

      - name: Method words
        run: |
          if git grep -n -i -E 'probe|probing|decompil|disassembl|emulat|reverse[- ]engineer|ghidra|rizin|unicorn|values_for' -- '*.cs' '*.md' ':!CONTRIBUTING.md'; then
            echo "::error::Public text states a client fact as a fact, never how it was found (listed above)"
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Source/NexusTomorrow.slnx

      - name: Build
        run: dotnet build Source/NexusTomorrow.slnx --configuration Debug --no-restore

      # dotnet format loads source generators from the build's output, so it runs after the build.
      - name: Format
        run: dotnet format Source/NexusTomorrow.slnx --verify-no-changes --no-restore

      - name: Prepare PostgreSQL
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          PW=$(openssl rand -hex 32); echo "::add-mask::$PW"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -v pw="$PW" <<'SQL'
          CREATE ROLE nt_test LOGIN CREATEDB NOSUPERUSER NOCREATEROLE PASSWORD :'pw';
          SQL
          umask 077; printf 'localhost:5432:*:nt_test:%s\n' "$PW" > ~/.pgpass; chmod 600 ~/.pgpass
          docker exec "$PG_CONTAINER" sh -c 'sed -i -E "/^host/ s/trust\$/scram-sha-256/" "$PGDATA/pg_hba.conf"'
          docker exec -u postgres "$PG_CONTAINER" psql -U postgres -tAc 'SELECT pg_reload_conf()'
          psql "host=localhost port=5432 dbname=postgres user=nt_test" -w -tAc 'SELECT current_user'
          if PGPASSFILE=/dev/null psql "host=localhost port=5432 dbname=postgres user=nt_test" -w -tAc 'SELECT 1' >/dev/null 2>&1; then
            echo "::error::logged in without the pgpass file"; exit 1
          fi

      # Every test application gets the filter, and one the filter leaves empty exits with code 8 ("Zero tests ran"), which
      # fails the run. A filtered run ignores that code; the next step fails it instead when no application ran a test.
      - name: Test
        env:
          TEST_ARGS: ${{ inputs.args }}
        run: |
          set -f
          args="--report-trx $TEST_ARGS"
          case " $TEST_ARGS " in
            *" --filter"* | *" --treenode-filter"*)
              case " $TEST_ARGS " in
                *" --ignore-exit-code "*) ;;
                *) args="$args --ignore-exit-code 8" ;;
              esac ;;
          esac
          dotnet test --solution Source/NexusTomorrow.slnx --configuration Debug --no-build \
            --results-directory "$RUNNER_TEMP/test-results" -- $args

      - name: Executed tests
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=("$RUNNER_TEMP"/test-results/**/*.trx)
          executed=0
          for file in "${files[@]}"; do
            count=$(grep -o '<Counters [^>]*' "$file" | grep -o ' executed="[0-9]*"' | grep -o '[0-9]\+' || true)
            executed=$((executed + ${count:-0}))
          done
          echo "${#files[@]} result files, $executed tests executed"
          if [ "$executed" -eq 0 ]; then
            echo "::error::No test executed: the filter matched no test"
            exit 1
          fi

      # In-process tooling exists only in Debug builds (Tools/NexusTomorrow.Tools and the Gateway's ClientConnection.Debug.cs). The
      # Release build restores for itself, since the server references the tools in Debug only, and its ReleaseBuildTests prove no send
      # there skips the send gate.
      - name: Release build
        run: dotnet build Source/NexusTomorrow.slnx --configuration Release

      - name: Release carries no debug tools
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          dotnet test --solution Source/NexusTomorrow.slnx --configuration Release --no-build \
            --results-directory "$RUNNER_TEMP/release-results" -- --report-trx --filter-class '*ReleaseBuildTests*' --ignore-exit-code 8
          executed=0
          for file in "$RUNNER_TEMP"/release-results/**/*.trx; do
            count=$(grep -o '<Counters [^>]*' "$file" | grep -o ' executed="[0-9]*"' | grep -o '[0-9]\+' || true)
            executed=$((executed + ${count:-0}))
          done
          echo "$executed release checks executed"
          if [ "$executed" -lt 2 ]; then
            echo "::error::The release checks did not run"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
